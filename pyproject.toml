[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sieve"
version = "0.5.0"
description = "Multi-layer context compression for LLM coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "tiktoken>=0.7",
  "tree-sitter>=0.26",
  "tree-sitter-language-pack>=1.25",
  "mcp>=2.0",
  "fastapi>=0.165",
  "uvicorn>=0.54",
  "fastembed>=0.9",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=9", "ruff>=0.6", "mypy>=1.10", "httpx>=0.28"]

[project.scripts]
sieve = "sieve.cli:main"
sieve-mcp = "sieve.server.mcp:main"
sieve-serve = "sieve.http_server:run"

[tool.setuptools.packages.find]
include = ["sieve*"]

[tool.setuptools.package-data]
sieve = ["allocator_learned.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"run_eval.py" = ["E501"]
"tools/build_large_repo.py" = ["E501"]
"sieve/parse/regex_fallback.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
