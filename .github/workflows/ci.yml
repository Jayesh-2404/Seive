name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check sieve tests tools run_eval.py
      - name: Tests
        run: python -m pytest -q
      - name: Retrieval eval
        run: python run_eval.py 600
      - name: HTTP import
        run: python -c "from sieve.http_server import app; print(app.title)"
